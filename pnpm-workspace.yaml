packages:
  - backend/*
  - frontend/*
  - packages/*
  - database

injectWorkspacePackages: true

minimumReleaseAgeExclude:
  - '@types/react-dom@19.2.4'
  - '@types/react@19.2.18'
  - '@vitejs/plugin-react@6.0.5'
  - bullmq@6.0.2
  - lucide-react@1.28.0
  - vite@8.2.0

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
