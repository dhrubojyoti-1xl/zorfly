name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: zorfly
          POSTGRES_PASSWORD: zorfly-ci
          POSTGRES_USER: zorfly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zorfly -d zorfly" --health-interval 5s --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://zorfly:zorfly-ci@localhost:5432/zorfly
      DATABASE_DIRECT_URL: postgresql://zorfly:zorfly-ci@localhost:5432/zorfly
      TEST_DATABASE_URL: postgresql://zorfly:zorfly-ci@localhost:5432/zorfly

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Docker Compose
        run: docker compose -f docker/compose.yml config --quiet

      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy

      - name: Validate repository
        run: pnpm validate

  docker-build:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, web]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image (verification only, not pushed)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: false
          tags: zorfly-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
