name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: zorfly
          POSTGRES_PASSWORD: zorfly-ci
          POSTGRES_USER: zorfly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zorfly -d zorfly" --health-interval 5s --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://zorfly:zorfly-ci@localhost:5432/zorfly
      DATABASE_DIRECT_URL: postgresql://zorfly:zorfly-ci@localhost:5432/zorfly
      TEST_DATABASE_URL: postgresql://zorfly:zorfly-ci@localhost:5432/zorfly

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Docker Compose
        run: docker compose -f docker/compose.yml config --quiet

      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy

      - name: Validate repository
        run: pnpm validate
