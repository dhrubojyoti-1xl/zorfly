services:
  - type: keyvalue
    name: zorfly-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: zorfly-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: >-
      corepack enable && corepack prepare pnpm@11.18.0 --activate && pnpm install --frozen-lockfile
      && pnpm db:generate && pnpm --filter @zorfly/api... build
    startCommand: pnpm db:migrate:deploy && pnpm --filter @zorfly/api start
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: API_HOST
        value: 0.0.0.0
      - key: WEB_ORIGIN
        value: https://zorfly-web.onrender.com
      - key: APP_URL
        value: https://zorfly-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: zorfly-db
          property: connectionString
      - key: DATABASE_DIRECT_URL
        fromDatabase:
          name: zorfly-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: zorfly-redis
          property: connectionString
      - key: SESSION_SIGNING_KEY
        generateValue: true
      - key: SESSION_HASH_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: zorfly-web
    runtime: static
    buildCommand: >-
      corepack enable && corepack prepare pnpm@11.18.0 --activate && pnpm install --frozen-lockfile
      && pnpm --filter @zorfly/web... build
    staticPublishPath: frontend/web/dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        value: https://zorfly-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: zorfly-db
    plan: free
    region: singapore
    postgresMajorVersion: '17'
    databaseName: zorfly
    user: zorfly
    ipAllowList: []
